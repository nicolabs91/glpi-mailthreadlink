name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  header-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
      - run: php tests/thread_headers.php
      - run: find . -name '*.php' -type f -print0 | xargs -0 -n1 php -l
